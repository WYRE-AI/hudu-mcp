name: OpenCodeReview

# Automated AI PR review via alibaba/open-code-review, backed by our Azure
# AI Foundry deployment (wyre-foundry-ocr, WYRE AI tenant / rg-foundry).
# Ported from WYRE-AI/conduit's ocr-review.yml; runs alongside CodeRabbit and
# posts inline comments automatically.
#
# COMMENT-ONLY (2026-11-20, Aaron; mirrors WYRE-AI/conduit#2686): Approve,
# auto-merge, merge, and `gh pr ready` are DISABLED. Approve and merge disabled
# pending branch protection: merges now require CodeRabbit to approve the head
# commit (coderabbit-gate.yml). This workflow must never submit APPROVE or
# REQUEST_CHANGES, never enable auto-merge, never call merge, and never
# undraft a PR. It posts COMMENT reviews only. Re-enable approve/merge only if
# a human explicitly decides to reintroduce those steps.
#
# Setup this repo needs: secrets.AZURE_OPENAI_OCR_API_KEY.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  # pull-requests: write is required for the action to post COMMENT reviews
  # and sticky summary comments. No contents write; no approve/merge.
  pull-requests: write

# A rapid second push (synchronize) before the first run finishes would
# otherwise let a stale run keep posting; cancel the superseded run.
concurrency:
  group: ocr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ocr-review:
    name: ocr-review
    # Dependabot-triggered runs only get Dependabot secrets, never Actions
    # secrets. AZURE_OPENAI_OCR_API_KEY resolves empty there and OCR exits
    # with "auth_token_cmd for llm config produced empty output" (#63, #70,
    # #71, e.g. run 38499813473). Skip the job instead of failing red. To
    # get AI review on Dependabot PRs again, add AZURE_OPENAI_OCR_API_KEY as a
    # Dependabot secret (org or repo) from Infisical, then drop this guard.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run OpenCodeReview
        id: ocr
        # Pinned v1.11.2 (5cf97d0d) shipped the `auth_token_cmd` deferred
        # LLM-auth mechanism (alibaba/open-code-review#1051, 2026-08-25) but
        # never wired OCR_LLM_TOKEN into the "Run OpenCodeReview" step's own
        # env — that step only had BASE_REF/HEAD_SHA/etc, so the deferred
        # `printf "%s" "$OCR_LLM_TOKEN"` resolved against an empty var and
        # every run failed with "auth_token_cmd for llm config produced
        # empty output" (verified live in this repo's own run logs, e.g.
        # run 36474474203). Upstream fixed it by v1.12.12 (182898cf) by
        # adding OCR_LLM_TOKEN: ${{ inputs.llm_auth_token }} to that step's
        # env — bumping the pin to pick that fix up. The secret itself was
        # never the problem.
        uses: alibaba/open-code-review@182898cf522da3d04157b422752d028417974e19  # v1.12.12
        with:
          llm_url: https://wyre-foundry-ocr.cognitiveservices.azure.com/openai/v1/chat/completions
          llm_auth_token: ${{ secrets.AZURE_OPENAI_OCR_API_KEY }}
          llm_model: gpt-5-mini
          llm_use_anthropic: 'false'
          llm_auth_header: authorization
          # gpt-5-mini is a reasoning model — without reasoning_effort pinned
          # low it spends its whole completion budget on invisible reasoning
          # and returns empty content (see WYRE-AI/conduit's ocr-review.yml
          # for the verified-live details of this fix).
          llm_extra_body: '{"reasoning_effort": "low"}'
          sticky_summary: 'true'
          checkpoint_range: 'true'
