# CodeRabbit merge gate (Aaron, 2026-11-20; WYREAI-1648).
#
# Required check "CodeRabbit approved head" passes only when CodeRabbit's
# latest decisive review on the PR (APPROVED or CHANGES_REQUESTED) is an
# APPROVED review of the exact head commit. So no PR merges until CodeRabbit
# has approved its final commit: not on an OCR-bot approval, not while
# CodeRabbit is rate limited (its own `CodeRabbit` check run ends "neutral"
# then, which GitHub counts as passing, and `fail_commit_status` never fails
# rate-limited reviews), and not after a push that came after the review.
#
# Every decision runs main's copy of this file and .github/scripts/
# coderabbit-gate.sh, never PR-controlled workflow content:
# - pull_request_target: main's copy, no checkout of PR code, read-only.
# - workflow_run of coderabbit-gate-review-trigger (fired by reviews):
#   workflow_run always runs the default-branch copy; it checks out main
#   only and writes the result as a check run on each open PR whose head is
#   the reviewed commit.
#
# Runs for one PR are serialized (concurrency group per PR number, resolved
# before the deciding job starts), so the last published result reflects the
# latest decisive CodeRabbit review.
#
# Limit: every workflow in the repo reports as the github-actions app, so a
# PR that adds its own job named "CodeRabbit approved head" could forge a
# passing check; that holds for every required Actions check. The
# unforgeable form is an org ruleset "Require workflows to pass" pointing at
# this file (needs an org owner). Until then, CodeRabbit's review of
# .github/workflows/** changes is the backstop.
#
# Draft and dependabot PRs fail until CodeRabbit reviews them
# (`@coderabbitai review`). Do not use `@coderabbitai approve` to get past
# the gate: that approves without a review.
name: coderabbit-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [coderabbit-gate-review-trigger]
    types: [completed]

permissions: {}

jobs:
  gate:
    if: github.event_name == 'pull_request_target'
    name: CodeRabbit approved head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: coderabbit-gate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout gate script from main (never PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/coderabbit-gate.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require a CodeRabbit APPROVED review on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/coderabbit-gate.sh

  # After a review: find every open PR whose head IS the reviewed commit
  # (exact match, so stacked PRs that merely contain it are not picked), then
  # evaluate each one in its own serialized job.
  resolve:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          prs=$(gh api --paginate --slurp "repos/${REPO}/commits/${RUN_SHA}/pulls?per_page=100" \
            | jq -c --arg sha "$RUN_SHA" '[.[][] | select(.state == "open" and .head.sha == $sha) | .number]')
          echo "Open PRs with head ${RUN_SHA}: ${prs}"
          echo "prs=${prs}" >> "$GITHUB_OUTPUT"

  after-review:
    needs: resolve
    if: needs.resolve.outputs.prs != '' && needs.resolve.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    concurrency:
      group: coderabbit-gate-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout gate script from main (never PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/coderabbit-gate.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read the PR's current head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr }}
        run: echo "head=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)" >> "$GITHUB_OUTPUT"
      - name: Evaluate gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: bash .github/scripts/coderabbit-gate.sh
      - name: Publish "CodeRabbit approved head" check on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          OUTCOME: ${{ steps.gate.outcome }}
          SUMMARY: ${{ steps.gate.outputs.summary }}
        run: |
          set -euo pipefail
          conclusion=failure
          [[ "$OUTCOME" == "success" ]] && conclusion=success
          jq -n --arg sha "$HEAD_SHA" --arg c "$conclusion" --arg s "${SUMMARY:-see run log}" \
            '{name: "CodeRabbit approved head", head_sha: $sha, status: "completed", conclusion: $c,
              output: {title: ("CodeRabbit gate: " + $c), summary: $s}}' \
            | gh api -X POST "repos/${REPO}/check-runs" --input - >/dev/null
          echo "Published ${conclusion} on ${HEAD_SHA}"
